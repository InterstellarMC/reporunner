[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reporunner"
version = "0.1.0"
description = "RepoRunner — team Astroworld, Agentathon 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "docker",
    "streamlit",
    "playwright",
    "typer>=0.9",
    "rich>=13",
    "httpx>=0.27"
]

[project.scripts]
reporunner = "reporunner.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["reporunner"]
