version: "1.0"
description: "Benchmark manifest of 10 repositories (7 expected fixable, 3 deliberately blocked)"

benchmarks:
  # 7 Expected Fixable Entries
  - id: "F1"
    name: "python-flask-missing-dependency"
    stack: "python"
    framework: "flask"
    fault: "Dependency missing from requirements.txt"
    verification_type: "http"
    http_port: 5000
    expected_outcome: "GREEN"
    repo_url: "https://github.com/astroworld-fixtures/flask-broken-deps"

  - id: "F2"
    name: "python-cli-syntax-version"
    stack: "python"
    framework: "cli"
    fault: "Syntax incompatible with pinned interpreter version"
    verification_type: "cli"
    cli_command: "python3 /workspace/main.py --help"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/astroworld-fixtures/python-cli-syntax"

  - id: "F3"
    name: "node-express-start-script"
    stack: "node"
    framework: "express"
    fault: "Wrong start script and missing port env default"
    verification_type: "http"
    http_port: 3000
    expected_outcome: "GREEN"
    repo_url: "https://github.com/astroworld-fixtures/node-express-env"

  - id: "F4"
    name: "node-vite-lockfile-mismatch"
    stack: "node"
    framework: "vite"
    fault: "Build fails from lockfile mismatch"
    verification_type: "http"
    http_port: 5173
    expected_outcome: "GREEN"
    repo_url: "https://github.com/astroworld-fixtures/vite-lockfile"

  - id: "F5"
    name: "python-fastapi-import-rename"
    stack: "python"
    framework: "fastapi"
    fault: "Import error after module rename"
    verification_type: "http"
    http_port: 8000
    expected_outcome: "GREEN"
    repo_url: "https://github.com/astroworld-fixtures/fastapi-rename"

  - id: "F6"
    name: "node-cli-broken-bin"
    stack: "node"
    framework: "cli"
    fault: "Broken bin entry in package.json"
    verification_type: "cli"
    cli_command: "node /workspace/bin/cli.js --help"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/astroworld-fixtures/node-cli-bin"

  - id: "F7"
    name: "python-lib-version-conflict"
    stack: "python"
    framework: "library"
    fault: "Test failures from dependency version conflict"
    verification_type: "pytest"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/astroworld-fixtures/python-lib-conflict"

  # 3 Deliberately Blocked Entries
  - id: "B1"
    name: "blocked-paid-api-key"
    stack: "python"
    framework: "api"
    blocker_type: "secret"
    blocker_name: "OPENAI_API_KEY"
    fault: "Needs a paid third-party API key at startup"
    verification_type: "http"
    expected_outcome: "BLOCKED"
    repo_url: "https://github.com/astroworld-fixtures/blocked-api-key"

  - id: "B2"
    name: "blocked-gpu-cuda"
    stack: "python"
    framework: "pytorch"
    blocker_type: "hardware"
    blocker_name: "NVIDIA_CUDA_GPU"
    fault: "Requires a GPU and CUDA device"
    verification_type: "cli"
    expected_outcome: "BLOCKED"
    repo_url: "https://github.com/astroworld-fixtures/blocked-gpu"

  - id: "B3"
    name: "blocked-private-package"
    stack: "node"
    framework: "enterprise"
    blocker_type: "package"
    blocker_name: "@astroworld/private-core"
    fault: "Needs private package registry or proprietary external service"
    verification_type: "http"
    expected_outcome: "BLOCKED"
    repo_url: "https://github.com/astroworld-fixtures/blocked-private-registry"
