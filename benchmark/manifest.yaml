version: "2.0"
description: "Benchmark manifest of 10 genuine public GitHub repositories with pinned commit SHAs (7 expected fixable, 3 deliberately blocked)"

benchmarks:
  # 7 Expected Fixable Entries (Real Public Repositories with Pinned SHAs)
  - id: "F1"
    name: "bottle-microframework"
    stack: "python"
    framework: "wsgi"
    fault: "Standard WSGI setup and test verification"
    verification_type: "pytest"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/bottlepy/bottle.git"
    commit_sha: "aba0c1a7ee59ed851db001d100b6a792b54a94a3"

  - id: "F2"
    name: "six-compatibility-lib"
    stack: "python"
    framework: "library"
    fault: "Python 2/3 compatibility library test suite"
    verification_type: "pytest"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/benjaminp/six.git"
    commit_sha: "c8e394065cd541a16c040515dc0afb85cf22a7c3"

  - id: "F3"
    name: "colorama-terminal-colors"
    stack: "python"
    framework: "library"
    fault: "Cross-platform terminal coloring library"
    verification_type: "pytest"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/tartley/colorama.git"
    commit_sha: "841634ed2a0da5d5ac2d867db533da8131266cb2"

  - id: "F4"
    name: "pallets-click-cli"
    stack: "python"
    framework: "cli"
    fault: "Composable CLI interface toolkit"
    verification_type: "pytest"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/pallets/click.git"
    commit_sha: "2247b35ea1c47c727d7a06e51fa280e12a863ff6"

  - id: "F5"
    name: "pallets-markupsafe"
    stack: "python"
    framework: "library"
    fault: "Untrusted string HTML escaping library"
    verification_type: "pytest"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/pallets/markupsafe.git"
    commit_sha: "4e111271b1494995708a9e878a10829b5e10c7ba"

  - id: "F6"
    name: "sindresorhus-is"
    stack: "node"
    framework: "library"
    fault: "Node.js type check utility library"
    verification_type: "node"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/sindresorhus/is.git"
    commit_sha: "e9c026c611c1160eaad50da00be4e676b626018f"

  - id: "F7"
    name: "pillarjs-send"
    stack: "node"
    framework: "express"
    fault: "Streaming static file delivery module"
    verification_type: "node"
    expected_outcome: "GREEN"
    repo_url: "https://github.com/pillarjs/send.git"
    commit_sha: "092f3fc77f0e796519ac328c543c11cced8f2244"

  # 3 Deliberately Blocked Entries (Real Public Repositories with Pinned SHAs)
  - id: "B1"
    name: "openai-quickstart-secret-blocked"
    stack: "python"
    framework: "api"
    blocker_type: "secret"
    blocker_name: "OPENAI_API_KEY"
    fault: "Requires paid third-party API secret key at runtime"
    verification_type: "cli"
    expected_outcome: "BLOCKED"
    repo_url: "https://github.com/openai/openai-quickstart-python.git"
    commit_sha: "ec8890d101bdc17d66512d94a76b5e7131d188a1"

  - id: "B2"
    name: "nanogpt-gpu-cuda-blocked"
    stack: "python"
    framework: "pytorch"
    blocker_type: "hardware"
    blocker_name: "NVIDIA_CUDA_GPU"
    fault: "Requires GPU hardware and CUDA device acceleration"
    verification_type: "cli"
    expected_outcome: "BLOCKED"
    repo_url: "https://github.com/karpathy/nanoGPT.git"
    commit_sha: "3adf61e154c3fe3fca428ad6bc3818b27a3b8291"

  - id: "B3"
    name: "git-submodule-private-blocked"
    stack: "node"
    framework: "submodule"
    blocker_type: "package"
    blocker_name: "inaccessible-submodule-dep"
    fault: "Requires inaccessible remote dependency or submodule credentials"
    verification_type: "node"
    expected_outcome: "BLOCKED"
    repo_url: "https://github.com/git-fixtures/submodule.git"
    commit_sha: "b685400c1f9316f350965a5993d350bc746b0bf4"
